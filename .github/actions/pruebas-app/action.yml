# Pasos del CI de Flutter: analyze y tests de la app y los dos paquetes.
name: Pruebas de la app
description: flutter analyze + flutter test del workspace

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        # La misma versión con la que se desarrolla (ver `flutter --version`).
        flutter-version: "3.41.7"
        channel: stable
        cache: true
    - name: Dependencias del workspace
      shell: bash
      run: flutter pub get
    - name: flutter analyze (cero issues)
      shell: bash
      run: flutter analyze
    - name: Tests de la app (flavor mock)
      shell: bash
      working-directory: apps/mobile
      # Resultado por caso (JSON) y cobertura (lcov) quedan en reports/ y se
      # suben abajo: evidencia de APF3.
      run: |
        mkdir -p reports
        flutter test --coverage --coverage-path=reports/lcov.info \
          --file-reporter=json:reports/flutter-tests.json
    - name: Tests de usabilidad (visibles como paso propio)
      shell: bash
      working-directory: apps/mobile
      run: flutter test test/usabilidad --file-reporter=json:reports/usabilidad.json
    - name: Tests de core_kernel
      shell: bash
      working-directory: packages/core_kernel
      run: flutter test
    - name: Tests de design_system
      shell: bash
      working-directory: packages/design_system
      run: flutter test
    - name: Subir reportes (resultados y cobertura de la app)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reportes-app
        path: apps/mobile/reports/
        if-no-files-found: warn
        retention-days: 90
