# Pasos de las pruebas del backend. Los usan `ci.yml` (en cada PR) y
# `cd-backend.yml` (antes de desplegar), así ambos prueban exactamente igual.
#
# El job que la llame debe levantar el servicio `postgres` (Postgres 16, base
# `cuycash_test`) y definir TEST_POSTGRES_URL: toda la suite corre contra el
# motor de producción. Sin la variable caería a SQLite, que no hace cumplir el
# largo de VARCHAR ni el bloqueo de fila.
name: Pruebas del backend
description: pytest de services/api contra PostgreSQL

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        # La misma versión que la imagen de Docker que corre en Render.
        python-version: "3.10"
        cache: pip
        cache-dependency-path: services/api/requirements-dev.txt
    - name: Dependencias
      shell: bash
      working-directory: services/api
      run: pip install -r requirements-dev.txt
    - name: pytest (seguridad web, DDL y concurrencia incluidos)
      shell: bash
      working-directory: services/api
      run: |
        if [ -z "${TEST_POSTGRES_URL:-}" ]; then
          echo "::error::Falta TEST_POSTGRES_URL: las pruebas deben correr contra Postgres."
          exit 1
        fi
        # -rs lista lo omitido: con Postgres no debería omitirse nada.
        python -m pytest -q -rs
