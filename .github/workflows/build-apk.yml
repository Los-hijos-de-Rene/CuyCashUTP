# Compila el APK de producción y lo publica.
#
# Al crear un tag `v*` (p. ej. `git tag v0.3.0 && git push origin v0.3.0`) el
# APK queda adjunto a un Release de GitHub; lanzado a mano, queda como
# artefacto del workflow.
#
# La app no tiene rollback remoto: un APK instalado no se puede retroceder. El
# rollback de producción es el del backend (rollback-backend.yml), y por eso
# el backend debe seguir aceptando lo que mandan las versiones anteriores.
#
# Firma con la clave propia y, si Firebase está configurado, invita a los
# testers por App Distribution. Secretos y alta: docs/despliegue.md.
name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK flavor production
    runs-on: ubuntu-24.04
    env:
      # A nivel de job porque los `if` de los pasos no pueden leer `secrets`.
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configuración de producción
        working-directory: apps/mobile
        # Solo la URL pública del backend: la clave del KYC vive en el backend
        # (KYC_BASE_URL/KYC_API_KEY en Render) y nunca en el binario.
        # KYC_ENABLED en "true": el registro usa el KYC real (servicio
        # cuycash-kyc en Render) a través del proxy /v1/kyc del backend.
        run: |
          cat > config.production.json <<'JSON'
          {
            "AUTH_BASE_URL": "https://cuycashutp.onrender.com",
            "KYC_ENABLED": "true"
          }
          JSON
      - name: Clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Sin clave no se compila: Gradle caería en la de depuración, que cambia
        # en cada runner, y el APK no actualizaría al instalado.
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (docs/despliegue.md)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cuycash-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cuycash-release.jks" >> "$GITHUB_ENV"
      - name: flutter build apk
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # El número de corrida como versionCode: siempre crece, y Android no
        # instala un APK con un versionCode menor al del instalado.
        run: >-
          flutter build apk --release --flavor production
          -t lib/main_production.dart
          --dart-define-from-file=config.production.json
          --build-number=${{ github.run_number }}
      - name: Nombrar el APK con la versión
        id: apk
        working-directory: apps/mobile
        run: |
          nombre="cuycash-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/flutter-apk/app-production-release.apk "$nombre"
          echo "ruta=apps/mobile/$nombre" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-production
          path: ${{ steps.apk.outputs.ruta }}
      - name: Adjuntar al Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.ruta }}" \
            --title "CuyCash $GITHUB_REF_NAME" --generate-notes
      - name: Publicar en Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK: ${{ steps.apk.outputs.ruta }}
        # Con la CLI oficial: la credencial no pasa por una action de terceros.
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15.35.0 appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups equipo \
            --release-notes "CuyCash $GITHUB_REF_NAME (${GITHUB_SHA::7})"
