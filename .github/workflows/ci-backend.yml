# CI del backend (services/api).
#
# Corre en cada PR que toque el backend, y en main lo llama el CD
# (`workflow_call`): nada se despliega sin pasar por aquí.
name: CI backend

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/ci-backend.yml"
  # En main no se dispara solo: lo llama el CD, que corre después el despliegue.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: services/api

jobs:
  pruebas:
    name: Pruebas (PostgreSQL 16)
    # TODA la suite contra Postgres, el motor de producción (Neon): las
    # diferencias de dialecto (SAVEPOINT, FOR UPDATE, tipos) solo se ven aquí.
    # Incluye las pruebas de concurrencia (marca `postgres`), que con
    # TEST_POSTGRES_URL definida dejan de omitirse.
    # En local, sin la variable, la misma suite corre sobre SQLite en memoria
    # para no exigir Docker.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cuycash
          POSTGRES_PASSWORD: cuycash
          # El fixture se niega a correr si la base no termina en `_test`.
          POSTGRES_DB: cuycash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuycash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://cuycash:cuycash@localhost:5432/cuycash_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # La misma versión que la imagen de Docker que corre en Render.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (seguridad web, DDL y concurrencia incluidos)
        # -rs lista lo omitido: con Postgres no debería omitirse nada.
        run: python -m pytest -q -rs
