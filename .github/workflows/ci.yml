# Puerta de entrada de todo PR (y de cada push a main).
#
# Corre SIEMPRE, sin filtro de rutas en el disparador, y decide por dentro qué
# pruebas hacen falta. Los pasos viven en `.github/actions/pruebas-*`, y el CD
# usa los mismos. Termina con el job `CI listo`, el único check que exige la
# regla de `main`: si se exigiera el check de cada parte, un PR que no toca esa
# carpeta lo dejaría "esperando" para siempre y no se podría fusionar.
#
# Los jobs van en línea y no como workflows reutilizables: con `needs` sobre un
# workflow reutilizable y `if: always()`, GitHub no llegaba a crear `CI listo`.
name: CI

on:
  pull_request:
  # En main también: la app no tiene CD, y así `main` siempre muestra si sigue
  # en verde.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  cambios:
    name: Qué cambió
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            backend:
              - "services/api/**"
              - ".github/actions/pruebas-backend/**"
              - ".github/workflows/ci.yml"
            app:
              - "apps/**"
              - "packages/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - ".github/actions/pruebas-app/**"
              - ".github/workflows/ci.yml"

  backend:
    name: Backend (PostgreSQL 16)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cuycash
          POSTGRES_PASSWORD: cuycash
          # El fixture se niega a correr si la base no termina en `_test`.
          POSTGRES_DB: cuycash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuycash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://cuycash:cuycash@localhost:5432/cuycash_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pruebas-backend

  app:
    name: App (Flutter)
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pruebas-app

  contrato:
    name: Contrato app ↔ API
    needs: cambios
    # La app y la API se prueban cada una contra su doble; aquí se prueban
    # juntas: los repositorios `Http*` reales de la app contra `services/api`
    # levantado (SQLite). Si el servidor cambia lo que responde, falla aquí.
    if: needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Levantar la API (SQLite)
        working-directory: services/api
        run: |
          pip install -r requirements.txt
          DATABASE_URL="sqlite+aiosqlite:///${RUNNER_TEMP}/contrato.db" \
            python -m alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:///${RUNNER_TEMP}/contrato.db" \
            python -m uvicorn app.main:app --port 8001 > "${RUNNER_TEMP}/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && exit 0
            sleep 1
          done
          echo "::error::La API no levantó."; cat "${RUNNER_TEMP}/api.log"; exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prueba de contrato (repositorios Http* reales contra la API)
        working-directory: apps/mobile
        run: |
          mkdir -p reports
          flutter test contract_test --dart-define=CONTRACT_API_URL=http://127.0.0.1:8001 \
            --file-reporter=json:reports/contrato.json
      - name: Log de la API si falló
        if: failure()
        run: cat "${RUNNER_TEMP}/api.log"
      - name: Subir reporte del contrato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-contrato
          path: apps/mobile/reports/
          if-no-files-found: warn
          retention-days: 90

  listo:
    name: CI listo
    needs: [cambios, backend, app, contrato]
    # Corre siempre: "omitido" (no cambió esa carpeta) cuenta como bien;
    # "fallido" o "cancelado", no.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Resultado
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          BACKEND: ${{ needs.backend.result }}
          APP: ${{ needs.app.result }}
          CONTRATO: ${{ needs.contrato.result }}
        run: |
          echo "Qué cambió: $CAMBIOS · Backend: $BACKEND · App: $APP · Contrato: $CONTRATO"
          for r in "$CAMBIOS" "$BACKEND" "$APP" "$CONTRATO"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Algún CI no pasó ($r)."; exit 1 ;;
            esac
          done
