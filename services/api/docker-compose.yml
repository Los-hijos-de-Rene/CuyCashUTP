# Entorno local completo: Postgres + API (+ KYC facial con el perfil `kyc`).
#
#   docker compose up --build                  # Postgres :5432 y API :8001
#   docker compose --profile kyc up --build    # además el KYC en :8000
#
# El KYC se construye desde su propio repositorio (CuyCashKYC), que se espera
# clonado junto a este: `<carpeta>/CuyCashUTP` y `<carpeta>/CuyCashKYC`. Si
# está en otro sitio, KYC_REPO_DIR en `.env` apunta a él.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cuycash
      POSTGRES_PASSWORD: cuycash
      POSTGRES_DB: cuycash
    ports:
      - "5432:5432"
    volumes:
      - cuycash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuycash"]
      interval: 5s
      retries: 10

  auth:
    build: .
    # 8001 para no chocar con el servicio de KYC, que usa el 8000.
    ports:
      - "0.0.0.0:8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://cuycash:cuycash@db:5432/cuycash
      OTP_NOTIFIER: ${OTP_NOTIFIER:-log}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Por la red interna de compose. Sin el perfil `kyc` levantado, el
      # proxy responde 503 y la app lo muestra como servicio no disponible.
      KYC_BASE_URL: ${KYC_BASE_URL:-http://kyc:8000}
      KYC_API_KEY: ${KYC_API_KEY:-cuycash-local-kyc}
      # En local el alta EXIGE un KYC aprobado (ticket del proxy). Si levantas
      # sin el perfil `kyc`, o con la app en KYC simulado, pon KYC_REQUIRED=false
      # en `.env` o el registro responderá KYC_REQUIRED.
      KYC_REQUIRED: ${KYC_REQUIRED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  kyc:
    profiles: ["kyc"]
    build: ${KYC_REPO_DIR:-../../../CuyCashKYC}
    # Publicado solo en el loopback: la app NO habla con el KYC, habla con la
    # API, que le agrega la clave. Así se prueba lo mismo que en producción.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${KYC_API_KEY:-cuycash-local-kyc}
      # Escala de SFace (1 - similitud coseno), el motor ONNX del KYC. No usar
      # el 0.68 de ArcFace: con SFace sería más permisivo de lo debido.
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.637}
      BLUR_LAPLACIAN_THRESHOLD: ${BLUR_LAPLACIAN_THRESHOLD:-80.0}
    # El plan gratuito de Render da 512 MB: con este tope, lo que pase en
    # local es lo que pasará allá.
    mem_limit: 512m
    restart: unless-stopped

volumes:
  cuycash_pgdata:
