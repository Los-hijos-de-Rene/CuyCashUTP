# Despliegue del servicio de API en Render.
#
# El blueprint vive en la raíz del repositorio y apunta a `services/api` con
# `rootDir`: es lo que permite desplegar un solo servicio del monorepo sin
# separarlo en otro repositorio.
#
# La base NO se declara aquí: Postgres es gestionado en Neon, y su cadena de
# conexión se carga como variable secreta desde el panel de Render. Así la
# credencial nunca pasa por el repositorio.

services:
  - type: web
    # El nombre quedó de cuando el servicio solo hacía auth: es el identificador en
    # Render, y cambiarlo crearía un servicio nuevo.
    name: cuycash-auth
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    # Render NO despliega solo al recibir un push: lo hace el workflow
    # `.github/workflows/cd-backend.yml`, y solo si pasaron las pruebas. Así un
    # commit en rojo nunca llega a producción, y un rollback no se deshace con
    # el siguiente push.
    autoDeployTrigger: "off"
    envVars:
      # sync:false ⇒ Render la pide al crear el servicio y la guarda cifrada.
      - key: DATABASE_URL
        sync: false
      # El canal del OTP. `log` escribe el código en el registro del servicio,
      # que es suficiente para la demo; `telegram` necesita las dos claves.
      - key: OTP_NOTIFIER
        value: log
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Proxy del KYC. La clave vive aquí y nunca en el binario de la app.
      - key: KYC_BASE_URL
        sync: false
      - key: KYC_API_KEY
        sync: false
