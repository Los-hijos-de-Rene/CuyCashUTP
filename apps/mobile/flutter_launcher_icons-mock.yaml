# Ícono del flavor `mock` (Android). Generado con tool/flavor_icons.dart a partir
# del logo de producción; regenerar con:
#   dart run tool/flavor_icons.dart && dart run flutter_launcher_icons
# Va a android/app/src/mock/res y solo afecta a ese flavor.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/mock/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5F5E5A"
  adaptive_icon_foreground: "assets/icons/mock/app_icon_foreground.png"
