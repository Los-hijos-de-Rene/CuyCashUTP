name: cuycash
description: CuyCash — app móvil (banca digital · Perú).
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  go_router: ^14.0.0
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  shared_preferences: ^2.3.0
  share_plus: ^11.0.0
  flutter_secure_storage: ^9.2.4
  core_kernel:
    path: ../../packages/core_kernel
  design_system:
    path: ../../packages/design_system
  url_launcher: ^6.3.2
  dio: ^5.11.1
  camera: ^0.12.0+2

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.15
  freezed: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cuycash.png

# Icono de app (logo CuyCash). Generar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/cuycash.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#152A1F"
  adaptive_icon_background: "#152A1F"
  adaptive_icon_foreground: "assets/cuycash.png"

# Splash nativo. Generar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#152A1F"
  image: "assets/cuycash.png"
  android_12:
    color: "#152A1F"
    image: "assets/cuycash.png"
